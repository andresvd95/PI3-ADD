name: Ejecutar actividad Titanic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Quitar resultados anteriores
        run: rm -f resumen_titanic.txt titanic_transformado.csv

      - name: Ejecutar notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute actividad_titanic.ipynb
          --inplace
          --ExecutePreprocessor.timeout=300

      - name: Verificar archivos generados
        shell: bash
        run: |
          test -s resumen_titanic.txt
          test -s titanic_transformado.csv
          python -c "import pandas as pd; df = pd.read_csv('titanic_transformado.csv'); assert df.shape == (891, 6), df.shape"

      - name: Guardar resultados de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: actividad-titanic-ejecutada
          path: |
            actividad_titanic.ipynb
            resumen_titanic.txt
            titanic_transformado.csv
