name: Ejecutar actividades del proyecto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Ejecutar pruebas de AE1
        run: python -m pytest -q AE1/tests

      - name: Quitar resultados anteriores
        run: |
          rm -f AE1/resultados/resumen_titanic.txt
          rm -f AE1/resultados/titanic_transformado.csv
          rm -f AE2/resultados/resumen_dataframe.txt
          rm -f "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/datos/titanic_preparado.csv"
          rm -f "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados/"*.csv
          rm -f "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados/resumen_dataframe_ae3.txt"

      - name: Ejecutar notebook de AE1
        run: >-
          jupyter nbconvert
          --to notebook
          --execute AE1/notebooks/actividad_titanic.ipynb
          --inplace
          --ExecutePreprocessor.timeout=300

      - name: Ejecutar notebook de AE2
        run: >-
          jupyter nbconvert
          --to notebook
          --execute AE2/notebooks/exploracion_titanic.ipynb
          --inplace
          --ExecutePreprocessor.timeout=300

      - name: Ejecutar pruebas de AE3
        run: python -m pytest -q "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/tests"

      - name: Ejecutar notebook de AE3
        run: >-
          jupyter nbconvert
          --to notebook
          --execute "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/notebooks/transformacion_enriquecimiento_titanic.ipynb"
          --inplace
          --ExecutePreprocessor.timeout=300

      - name: Verificar archivos generados
        shell: bash
        run: |
          test -s AE1/resultados/resumen_titanic.txt
          test -s AE1/resultados/titanic_transformado.csv
          test -s AE2/resultados/resumen_dataframe.txt
          python -c "import pandas as pd; df = pd.read_csv('AE1/resultados/titanic_transformado.csv'); assert df.shape == (891, 6), df.shape"
          grep -q "Identificador del dataset: BIT/titanic-dataset" AE2/resultados/resumen_dataframe.txt
          grep -q "Cantidad de filas: 891" AE2/resultados/resumen_dataframe.txt
          grep -q "Cantidad de columnas: 15" AE2/resultados/resumen_dataframe.txt
          test -s "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/datos/titanic_preparado.csv"
          test -s "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados/resumen_dataframe_ae3.txt"
          test "$(find "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados" -name 'pregunta_*.csv' | wc -l)" -eq 5
          python -c "import pandas as pd; df = pd.read_csv('AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/datos/titanic_preparado.csv'); assert df.shape == (891, 9), df.shape; assert int(df['sobrevivio'].sum()) == 342"

      - name: Guardar resultados de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: actividades-titanic-ejecutadas
          path: |
            AE1/notebooks/actividad_titanic.ipynb
            AE1/resultados/
            AE2/notebooks/exploracion_titanic.ipynb
            AE2/resultados/
            AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/notebooks/transformacion_enriquecimiento_titanic.ipynb
            AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/datos/
            AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados/

      - name: Publicar resultados generados en main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AE1/notebooks/actividad_titanic.ipynb AE1/resultados
          git add AE2/notebooks/exploracion_titanic.ipynb AE2/resultados
          git add "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/notebooks/transformacion_enriquecimiento_titanic.ipynb" "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/datos" "AE3 Proyecto integrador - Transformación y Enriquecimiento de Datos/resultados"
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar resultados automáticos de AE1, AE2 y AE3"
            git push origin HEAD:main
          fi
