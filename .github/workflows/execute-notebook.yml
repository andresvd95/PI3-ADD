name: Ejecutar actividad Titanic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Ejecutar pruebas
        run: python -m pytest -q

      - name: Ejecutar notebook
        run: >-
          jupyter nbconvert
          --to notebook
          --execute actividad_titanic.ipynb
          --inplace
          --ExecutePreprocessor.timeout=300

      - name: Verificar resumen generado
        shell: bash
        run: |
          test -s resumen_titanic.txt
          git diff --exit-code -- resumen_titanic.txt

      - name: Registrar ejecución automática
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add actividad_titanic.ipynb resumen_titanic.txt
          git commit --allow-empty -m "Ejecutar notebook automáticamente [skip ci]"
          git push

      - name: Guardar resultados de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: actividad-titanic-ejecutada
          path: |
            actividad_titanic.ipynb
            resumen_titanic.txt
